# Perfil "ci": solo lo usa GitHub Actions al correr las pruebas.
# No hay ningún valor sensible escrito aquí: todo llega por variables de entorno
# que el workflow genera en cada ejecución (base de datos temporal y clave JWT aleatoria).
spring.datasource.url=${CI_DB_URL}
spring.datasource.username=${CI_DB_USER}
spring.datasource.password=${CI_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

jwt.secret=${CI_JWT_SECRET}
jwt.expiration-ms=3600000

# Sin administrador inicial ni Mercado Pago en las pruebas
app.admin.email=
app.admin.password=
mercadopago.access-token=
