# Perfil de producción (Render)
spring.jpa.show-sql=false

# Pocas conexiones: Neon y la memoria de Render gratis son limitadas
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
# Neon cierra conexiones inactivas al suspenderse; el pool las renueva antes
spring.datasource.hikari.max-lifetime=240000

# Detrás del proxy de Render, usa la IP real del cliente (para el límite de intentos del login facial)
server.forward-headers-strategy=native