spring.application.name=gymflow-api
spring.profiles.active=local

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Swagger: conserva el token JWT al recargar la página
springdoc.swagger-ui.persist-authorization=true

# Mercado Pago: el token real va en application-local.properties (en la nube, en la variable MERCADOPAGO_ACCESS_TOKEN)
mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:}

# Dirección del cliente web: a donde Mercado Pago regresa al cliente después de pagar
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Direcciones desde las que el navegador puede llamar a la API (separadas por comas)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}


springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html