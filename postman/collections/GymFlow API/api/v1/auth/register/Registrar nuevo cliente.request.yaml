$kind: http-request
description: Crea una cuenta de cliente (ROLE_USER) y devuelve su token JWT de acceso.
url: "{{baseUrl}}/api/v1/auth/register"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "email": "carlos@gymflow.com",
      "nombre": "Carlos Mendoza",
      "password": "Cliente2026",
      "telefono": "9671234567"
    }
  $type: |-
    {
      "description": "Datos requeridos para el autorregistro de un nuevo cliente",
      "type": "object",
      "properties": {
        "nombre": {
          "type": "string",
          "minLength": 0,
          "maxLength": 100,
          "pattern": "^[\\p{L}][\\p{L}\\s.'’-]*$",
          "example": "Carlos Mendoza",
          "description": "Nombre completo del cliente"
        },
        "email": {
          "type": "string",
          "minLength": 0,
          "maxLength": 150,
          "pattern": "^[^@\\s]+@[^@\\s]+\\.[^@\\s]{2,}$",
          "example": "carlos@gymflow.com",
          "description": "Correo electrónico único"
        },
        "password": {
          "type": "string",
          "minLength": 1,
          "pattern": "^(?=.*[A-Za-z])(?=.*\\d)[\\x20-\\x7E]{8,72}$",
          "example": "Cliente2026",
          "description": "Contraseña (8 a 72 caracteres, al menos una letra y un número)"
        },
        "telefono": {
          "type": "string",
          "pattern": "^([0-9]{10})?$",
          "example": "9671234567",
          "description": "Teléfono celular a 10 dígitos (opcional)"
        }
      },
      "required": [
        "email",
        "nombre",
        "password"
      ]
    }
settings: {}
examples: ./.resources/Registrar nuevo cliente.resources/examples
order: 1000
