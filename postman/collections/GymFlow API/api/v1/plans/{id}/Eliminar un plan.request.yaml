$kind: http-request
description: Elimina un plan si no tiene membresías o pagos asociados. Solo ADMIN.
url: "{{baseUrl}}/api/v1/plans/:id"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  - key: id
    value: "1"
    disabled: false
    description: ID del plan
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "integer",
            "format": "int64"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: text
  content: ""
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/Eliminar un plan.resources/examples
order: 2000
