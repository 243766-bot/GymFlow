$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/plans"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "duracionDias": 30,
        "nombre": "Mensualidad Estándar",
        "precio": 450
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "duracionDias": 30,
        "id": 1,
        "nombre": "Mensualidad Estándar",
        "precio": 450
      }
    $type: |-
      {
        "description": "Información de un plan de membresía",
        "type": "object",
        "properties": {
          "id": {
            "type": "integer",
            "example": 1,
            "description": "ID único del plan",
            "format": "int64"
          },
          "nombre": {
            "type": "string",
            "example": "Mensualidad Estándar",
            "description": "Nombre del plan"
          },
          "duracionDias": {
            "type": "integer",
            "example": 30,
            "description": "Duración en días",
            "format": "int32"
          },
          "precio": {
            "type": "number",
            "example": 450,
            "description": "Precio en MXN"
          }
        },
        "required": [
          "duracionDias",
          "id",
          "nombre",
          "precio"
        ]
      }
order: 1000
