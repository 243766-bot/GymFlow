$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/cash-movements"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "concepto": "Compra de garrafones de agua y artículos de limpieza",
        "monto": 180
      }
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "Bad Request",
        "message": "El correo ya está registrado",
        "status": 400,
        "timestamp": "2026-11-20T13:15:30"
      }
    $type: |-
      {
        "description": "Estructura estandarizada para respuestas de error HTTP (4xx y 5xx)",
        "type": "object",
        "properties": {
          "timestamp": {
            "type": "string",
            "example": "2026-11-20T13:15:30",
            "description": "Fecha y hora en que ocurrió el error",
            "format": "date-time"
          },
          "status": {
            "type": "integer",
            "example": 400,
            "description": "Código de estado HTTP",
            "format": "int32"
          },
          "error": {
            "type": "string",
            "example": "Bad Request",
            "description": "Nombre estándar del estado HTTP"
          },
          "message": {
            "type": "string",
            "example": "El correo ya está registrado",
            "description": "Detalle legible de la causa del error"
          }
        },
        "required": [
          "error",
          "message",
          "status",
          "timestamp"
        ]
      }
order: 5000
