$kind: http-request
description: Permite al administrador dar de alta un cliente (ROLE_USER) u otro administrador (ROLE_ADMIN).
url: "{{baseUrl}}/api/v1/users"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "email": "ana.lopez@gymflow.com",
      "nombre": "Ana López",
      "password": "AnaGym2026",
      "telefono": "9679876543",
      "rol": "ROLE_USER"
    }
  $type: |-
    {
      "description": "Datos para creación de usuarios o administradores por parte de un ADMIN",
      "type": "object",
      "properties": {
        "nombre": {
          "type": "string",
          "minLength": 0,
          "maxLength": 100,
          "pattern": "^[\\p{L}][\\p{L}\\s.'’-]*$",
          "example": "Ana López",
          "description": "Nombre completo del usuario"
        },
        "email": {
          "type": "string",
          "minLength": 0,
          "maxLength": 150,
          "pattern": "^[^@\\s]+@[^@\\s]+\\.[^@\\s]{2,}$",
          "example": "ana.lopez@gymflow.com",
          "description": "Correo electrónico único"
        },
        "password": {
          "type": "string",
          "minLength": 1,
          "pattern": "^(?=.*[A-Za-z])(?=.*\\d)[\\x20-\\x7E]{8,72}$",
          "example": "AnaGym2026",
          "description": "Contraseña (8 a 72 caracteres, letras y números)"
        },
        "telefono": {
          "type": "string",
          "pattern": "^([0-9]{10})?$",
          "example": "9679876543",
          "description": "Teléfono celular de 10 dígitos (opcional)"
        },
        "rol": {
          "type": "string",
          "enum": [
            "ROLE_USER",
            "ROLE_ADMIN"
          ],
          "pattern": "ROLE_USER|ROLE_ADMIN",
          "example": "ROLE_USER",
          "description": "Rol asignado al usuario (por defecto ROLE_USER)"
        }
      },
      "required": [
        "email",
        "nombre",
        "password"
      ]
    }
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/Crear un nuevo usuario o administrador.resources/examples
order: 3000
