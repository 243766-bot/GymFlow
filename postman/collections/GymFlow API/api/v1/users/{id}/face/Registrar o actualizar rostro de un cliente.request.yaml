$kind: http-request
description: Guarda el descriptor biométrico de 128 valores flotantes y el consentimiento expreso del cliente.
url: "{{baseUrl}}/api/v1/users/:id/face"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: id
    value: "2"
    disabled: false
    description: ID del usuario
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "integer",
            "format": "int64"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: json
  content: |-
    {
      "consentimiento": true,
      "descriptor": [
        2292.9319519211444,
        5288.847958924582,
        1902.2550797301474,
        7053.339280995498,
        3603.5660969719784,
        1888.1022790564284,
        2930.9353127975933,
        8579.38162874372,
        8414.923471138178,
        1960.1582136056727,
        2207.567160296776,
        9153.405034871244,
        5953.753645310477,
        5362.370508627404,
        6425.790573280494,
        9955.87372400066,
        330.9089547709432,
        249.62275299770798,
        5021.279126021178,
        7020.3268437295565
      ],
      "foto": "data:image/jpeg;base64,/9j/4AAQSkZJRg..."
    }
  $type: |-
    {
      "description": "Datos para enrolar la plantilla facial de un cliente",
      "type": "object",
      "properties": {
        "descriptor": {
          "type": "array",
          "description": "Vector descriptor facial de exactamente 128 valores numéricos",
          "items": {
            "type": "number",
            "format": "double"
          }
        },
        "consentimiento": {
          "type": "boolean",
          "example": true,
          "description": "Confirmación explícita de consentimiento biométrico del cliente"
        },
        "foto": {
          "type": "string",
          "minLength": 0,
          "maxLength": 300000,
          "example": "data:image/jpeg;base64,/9j/4AAQSkZJRg...",
          "description": "Miniatura JPEG en formato Data URL Base64 (opcional)"
        }
      },
      "required": [
        "consentimiento",
        "descriptor"
      ]
    }
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/Registrar o actualizar rostro de un cliente.resources/examples
order: 2000
