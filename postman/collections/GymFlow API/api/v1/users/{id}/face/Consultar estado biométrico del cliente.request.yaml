$kind: http-request
description: Indica si el cliente tiene un descriptor facial registrado, su fecha de alta y su miniatura en Base64.
url: "{{baseUrl}}/api/v1/users/:id/face"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: id
    value: "2"
    disabled: false
    description: ID del usuario
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "integer",
            "format": "int64"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: text
  content: ""
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/Consultar estado biométrico del cliente.resources/examples
order: 1000
