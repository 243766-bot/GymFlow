$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/users/:id"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: id
      value: "2"
      disabled: false
      description: ID único del usuario
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "activo": true,
        "email": "carlos@gymflow.com",
        "fechaRegistro": "2026-11-01T09:00:00",
        "id": 2,
        "nombre": "Carlos Mendoza",
        "rol": "ROLE_USER",
        "rostroRegistrado": true,
        "telefono": "9671234567",
        "membresia": {
          "diasRestantes": 11,
          "estado": "ACTIVA",
          "fechaInicio": "2026-11-01",
          "fechaVencimiento": "2026-12-01",
          "id": 5,
          "plan": {
            "duracionDias": 30,
            "id": 1,
            "nombre": "Mensualidad Estándar",
            "precio": 450
          },
          "usuarioId": 2,
          "usuarioNombre": "Carlos Mendoza"
        }
      }
    $type: |-
      {
        "description": "Vista administrativa completa de un cliente incluyendo estado biométrico y membresía",
        "type": "object",
        "properties": {
          "id": {
            "type": "integer",
            "example": 2,
            "description": "ID único del cliente",
            "format": "int64"
          },
          "nombre": {
            "type": "string",
            "example": "Carlos Mendoza",
            "description": "Nombre completo"
          },
          "email": {
            "type": "string",
            "example": "carlos@gymflow.com",
            "description": "Correo electrónico"
          },
          "telefono": {
            "type": "string",
            "example": "9671234567",
            "description": "Teléfono a 10 dígitos"
          },
          "rol": {
            "type": "string",
            "enum": [
              "ROLE_USER",
              "ROLE_ADMIN"
            ],
            "example": "ROLE_USER",
            "description": "Rol asignado"
          },
          "activo": {
            "type": "boolean",
            "example": true,
            "description": "Estado de cuenta (false = baneado)"
          },
          "fechaRegistro": {
            "type": "string",
            "example": "2026-11-01T09:00:00",
            "description": "Fecha y hora de registro",
            "format": "date-time"
          },
          "rostroRegistrado": {
            "type": "boolean",
            "example": true,
            "description": "Indica si cuenta con rostro enrolado"
          },
          "membresia": {
            "type": "object",
            "description": "Detalle de membresía con estado calculado en tiempo real y días restantes",
            "properties": {
              "id": {
                "type": "integer",
                "example": 5,
                "description": "ID único de la membresía",
                "format": "int64"
              },
              "usuarioId": {
                "type": "integer",
                "example": 2,
                "description": "ID del cliente titular",
                "format": "int64"
              },
              "usuarioNombre": {
                "type": "string",
                "example": "Carlos Mendoza",
                "description": "Nombre del cliente titular"
              },
              "plan": {
                "type": "object",
                "description": "Información de un plan de membresía",
                "properties": {
                  "id": {
                    "type": "integer",
                    "example": 1,
                    "description": "ID único del plan",
                    "format": "int64"
                  },
                  "nombre": {
                    "type": "string",
                    "example": "Mensualidad Estándar",
                    "description": "Nombre del plan"
                  },
                  "duracionDias": {
                    "type": "integer",
                    "example": 30,
                    "description": "Duración en días",
                    "format": "int32"
                  },
                  "precio": {
                    "type": "number",
                    "example": 450,
                    "description": "Precio en MXN"
                  }
                },
                "required": [
                  "duracionDias",
                  "id",
                  "nombre",
                  "precio"
                ]
              },
              "fechaInicio": {
                "type": "string",
                "example": "2026-11-01",
                "description": "Fecha de inicio de vigencia",
                "format": "date"
              },
              "fechaVencimiento": {
                "type": "string",
                "example": "2026-12-01",
                "description": "Fecha de vencimiento",
                "format": "date"
              },
              "estado": {
                "type": "string",
                "enum": [
                  "ACTIVA",
                  "VENCIDA",
                  "CANCELADA"
                ],
                "example": "ACTIVA",
                "description": "Estado calculado de la membresía"
              },
              "diasRestantes": {
                "type": "integer",
                "example": 11,
                "description": "Días restantes de vigencia (0 si está vencida o cancelada)",
                "format": "int64"
              }
            },
            "required": [
              "diasRestantes",
              "estado",
              "fechaInicio",
              "fechaVencimiento",
              "id",
              "plan",
              "usuarioId",
              "usuarioNombre"
            ]
          }
        },
        "required": [
          "activo",
          "email",
          "fechaRegistro",
          "id",
          "nombre",
          "rol",
          "rostroRegistrado"
        ]
      }
order: 1000
