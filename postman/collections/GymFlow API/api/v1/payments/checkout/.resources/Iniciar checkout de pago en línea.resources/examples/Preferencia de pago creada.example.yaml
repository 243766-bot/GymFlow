$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/payments/checkout"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "planId": 1
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "pagoId": 14,
        "preferenciaId": "3847055086-a1b2c3d4-e5f6",
        "urlPago": "https://www.mercadopago.com.mx/checkout/v1/redirect?pref_id=..."
      }
    $type: |-
      {
        "description": "Datos de redirección a la pasarela de pago Mercado Pago",
        "type": "object",
        "properties": {
          "pagoId": {
            "type": "integer",
            "example": 14,
            "description": "ID interno del registro de pago",
            "format": "int64"
          },
          "preferenciaId": {
            "type": "string",
            "example": "3847055086-a1b2c3d4-e5f6",
            "description": "Identificador de preferencia en Mercado Pago"
          },
          "urlPago": {
            "type": "string",
            "example": "https://www.mercadopago.com.mx/checkout/v1/redirect?pref_id=...",
            "description": "URL de Checkout Pro a la cual redirigir al cliente"
          }
        },
        "required": [
          "pagoId",
          "preferenciaId",
          "urlPago"
        ]
      }
order: 1000
