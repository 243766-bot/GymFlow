$kind: http-request
description: Verifica en Mercado Pago si el pago fue aprobado; si se aprobó, activa o renueva la membresía automáticamente.
url: "{{baseUrl}}/api/v1/payments/:id/status"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: id
    value: "10"
    disabled: false
    description: ID interno del pago
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "integer",
            "format": "int64"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: text
  content: ""
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/Consultar estado de un pago en línea.resources/examples
order: 1000
