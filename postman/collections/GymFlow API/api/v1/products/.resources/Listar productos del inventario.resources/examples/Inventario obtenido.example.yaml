          "nombre": "Proteína Whey Gold Standard",
          "precio": 890,
          "stock": 15,
          "tamano": "907 g"
        },
        {
          "activo": true,
          "categoria": "Suplementos",
          "id": 1,
          "nombre": "Proteína Whey Gold Standard",
          "precio": 890,
          "stock": 15,
          "tamano": "907 g"
        }
      ]
    $type: |-
      {
        "type": "array",
        "items": {
          "description": "Información de un producto del inventario",
          "type": "object",
          "properties": {
            "id": {
              "type": "integer",
