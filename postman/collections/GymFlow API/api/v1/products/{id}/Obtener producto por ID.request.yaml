$kind: http-request
description: Consulta el detalle y existencias de un producto específico. Solo ADMIN.
url: "{{baseUrl}}/api/v1/products/:id"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: id
    value: "1"
    disabled: false
    description: ID del producto
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "integer",
            "format": "int64"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: text
  content: ""
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/Obtener producto por ID.resources/examples
order: 1000
