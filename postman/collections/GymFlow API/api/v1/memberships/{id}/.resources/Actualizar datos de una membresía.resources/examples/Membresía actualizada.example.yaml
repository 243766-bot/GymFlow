$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/memberships/:id"
  method: PUT
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: id
      value: "1"
      disabled: false
      description: ID de la membresía
  body:
    type: json
    content: |-
      {
        "planId": 2,
        "fechaInicio": "2026-11-20",
        "fechaVencimiento": "2026-12-20",
        "estado": "ACTIVA"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "diasRestantes": 11,
        "estado": "ACTIVA",
        "fechaInicio": "2026-11-01",
        "fechaVencimiento": "2026-12-01",
        "id": 5,
        "plan": {
          "duracionDias": 30,
          "id": 1,
          "nombre": "Mensualidad Estándar",
          "precio": 450
        },
        "usuarioId": 2,
        "usuarioNombre": "Carlos Mendoza"
      }
    $type: |-
      {
        "description": "Detalle de membresía con estado calculado en tiempo real y días restantes",
        "type": "object",
        "properties": {
          "id": {
            "type": "integer",
            "example": 5,
            "description": "ID único de la membresía",
            "format": "int64"
          },
          "usuarioId": {
            "type": "integer",
            "example": 2,
            "description": "ID del cliente titular",
            "format": "int64"
          },
          "usuarioNombre": {
            "type": "string",
            "example": "Carlos Mendoza",
            "description": "Nombre del cliente titular"
          },
          "plan": {
            "type": "object",
            "description": "Información de un plan de membresía",
            "properties": {
              "id": {
                "type": "integer",
                "example": 1,
                "description": "ID único del plan",
                "format": "int64"
              },
              "nombre": {
                "type": "string",
                "example": "Mensualidad Estándar",
                "description": "Nombre del plan"
              },
              "duracionDias": {
                "type": "integer",
                "example": 30,
                "description": "Duración en días",
                "format": "int32"
              },
              "precio": {
                "type": "number",
                "example": 450,
                "description": "Precio en MXN"
              }
            },
            "required": [
              "duracionDias",
              "id",
              "nombre",
              "precio"
            ]
          },
          "fechaInicio": {
            "type": "string",
            "example": "2026-11-01",
            "description": "Fecha de inicio de vigencia",
            "format": "date"
          },
          "fechaVencimiento": {
            "type": "string",
            "example": "2026-12-01",
            "description": "Fecha de vencimiento",
            "format": "date"
          },
          "estado": {
            "type": "string",
            "enum": [
              "ACTIVA",
              "VENCIDA",
              "CANCELADA"
            ],
            "example": "ACTIVA",
            "description": "Estado calculado de la membresía"
          },
          "diasRestantes": {
            "type": "integer",
            "example": 11,
            "description": "Días restantes de vigencia (0 si está vencida o cancelada)",
            "format": "int64"
          }
        },
        "required": [
          "diasRestantes",
          "estado",
          "fechaInicio",
          "fechaVencimiento",
          "id",
          "plan",
          "usuarioId",
          "usuarioNombre"
        ]
      }
order: 1000
